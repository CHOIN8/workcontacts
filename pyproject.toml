
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workcontacts"
version = "0.1.0"
description = "A personal and professional contact manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich==15.0.0"
]
[project.optional-dependencies]
dev = [
    "pytest==9.2.0"
]
[tool.hatch.build.targets.wheel]
packages = ["src/workcontacts"]


